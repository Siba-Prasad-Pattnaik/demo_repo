version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: document-analyzer-postgres
    environment:
      POSTGRES_DB: DocumentAnalyzer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - document-analyzer-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d DocumentAnalyzer"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: document-analyzer-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - document-analyzer-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis123

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: document-analyzer-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    networks:
      - document-analyzer-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    command: server /data --console-address ":9001"

  # Document Analyzer API
  api:
    build:
      context: .
      dockerfile: src/DocumentAnalyzer.API/Dockerfile
    container_name: document-analyzer-api
    ports:
      - "5000:80"
      - "5001:443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=DocumentAnalyzer;Username=postgres;Password=postgres123;
      - ConnectionStrings__RedisConnection=redis:6379,password=redis123
      - JwtSettings__SecretKey=DocumentAnalyzer2024SuperSecretKeyForJWTTokenGeneration123!
      - MinIOSettings__Endpoint=minio:9000
      - MinIOSettings__AccessKey=minioadmin
      - MinIOSettings__SecretKey=minioadmin123
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - document-analyzer-network
    restart: unless-stopped
    profiles:
      - full-stack

  # Document Analyzer Web (React Frontend)
  web:
    build:
      context: .
      dockerfile: src/DocumentAnalyzer.Web/Dockerfile
    container_name: document-analyzer-web
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - api
    networks:
      - document-analyzer-network
    restart: unless-stopped
    profiles:
      - full-stack

  # Elasticsearch for document search
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: document-analyzer-elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - document-analyzer-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    profiles:
      - full-stack

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  elasticsearch_data:
    driver: local

networks:
  document-analyzer-network:
    driver: bridge
    name: document-analyzer-network
